# =============================================================
# 主实验：多模型 × 多标的 横截面对比
# =============================================================
# 数据：盈透真实历史日线，近 5 年，美股 + 港股
# 成本：手续费 万五 单边，滑点 万五 单边，信号延迟 1 根 K 线执行
# =============================================================
name: main_compare

symbols:
  - SPY        # 标普500 ETF
  - QQQ        # 纳指100 ETF
  - AAPL       # 苹果（大盘蓝筹）
  - MSFT       # 微软
  - NVDA       # 英伟达（高波动成长）
  - TSLA       # 特斯拉（极高波动）
  - AMD        # AMD（高波动周期）
  - 700.HK     # 腾讯（港股，检验跨市场）

strategies:
  # --- 基准 ---
  - 买入持有

  # --- 趋势跟踪 ---
  - 双均线交叉
  - MACD交叉
  - ADX趋势过滤
  - 均线+长周期过滤
  - ATR移动止损

  # --- 突破 ---
  - 唐奇安突破
  - ATR通道突破

  # --- 均值回归 ---
  - RSI均值回归
  - RSI2极端反转
  - 布林带回归
  - ZScore回归
  - 布林+RSI双确认

  # --- 动量 ---
  - 时间序列动量
  - ROC动量阈值
  - 波动率目标动量

  # --- 机器学习 ---
  - name: 机器学习方向预测
    params:
      model: rf
      threshold: 0.55
      refit_every: 42
  - ML+趋势过滤

  # --- 组合 / 自适应 ---
  - 多策略投票
  - 信号加权混合
  - 状态自适应切换

duration: "5 Y"
bar_size: "1 day"
data_source: auto
initial_capital: 1000000
commission_rate: 0.0005
slippage_rate: 0.0005
include_benchmark: true

# 参数寻优（只对经典策略、在代表性标的上做，控成本）
run_optimization: true
opt_metric: 夏普比率
opt_top_n: 5
opt_strategies:
  - 双均线交叉
  - RSI均值回归
  - 唐奇安突破
  - 时间序列动量
  - ROC动量阈值
opt_symbols:
  - SPY
  - NVDA
  - 700.HK

run_walkforward: false
