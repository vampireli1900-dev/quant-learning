# =============================================================
# 走前验证实验：检验"参数寻优出来的最优解"是否过拟合
# =============================================================
# 流程：滚动窗口 → 训练段网格寻优 → 参数用到紧随其后的测试段
#       把所有测试段拼起来 = 样本外净值曲线
# 判读：样本外夏普 / 样本内夏普 > 0.5 才勉强可用，< 0.5 高度疑似过拟合
# =============================================================
name: walkforward_validation

symbols:
  - SPY
  - QQQ
  - NVDA
  - TSLA
  - 700.HK

strategies:
  - 买入持有
  - 双均线交叉
  - RSI均值回归
  - 唐奇安突破
  - 时间序列动量
  - ADX趋势过滤
  - 状态自适应切换

duration: "5 Y"
bar_size: "1 day"
initial_capital: 1000000
commission_rate: 0.0005
slippage_rate: 0.0005

run_walkforward: true
wf_train_bars: 756      # 训练段约 3 年
wf_test_bars: 126       # 测试段约 6 个月
wf_strategies:
  - 双均线交叉
  - RSI均值回归
  - 唐奇安突破
  - 时间序列动量
  - ADX趋势过滤
  - 状态自适应切换

run_optimization: false
