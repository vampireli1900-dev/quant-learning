<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuantLab">
<meta name="format-detection" content="telephone=no">
<title>QuantLab · 移动端</title>
<link rel="manifest" href="/static/mobile.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23131722'/%3E%3Cpath d='M4 16.5 9.5 11l3.5 3.5L20 7' fill='none' stroke='%232962ff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/mobile.css?v=20261020a">
</head>
<body>

<!-- ============ 启动 ============ -->
<div id="mbBoot">
  <div class="mb-logo">Quant<span>Lab</span></div>
  <div class="mb-bar"><i></i></div>
  <div class="mb-txt" data-i18n="boot.connecting">正在连接行情与实验结果…</div>
</div>

<div class="mapp" id="mapp" hidden>

  <!-- ============ 顶栏 ============ -->
  <header class="mhead" id="mhead">
    <button class="msym" id="msymBtn" type="button">
      <span class="msym-code" id="msymCode">SPY</span>
      <span class="msym-px">
        <b id="msymPx">—</b>
        <i id="msymChg">—</i>
      </span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="mhead-r">
      <span class="mkt" id="mkt"><i></i><span id="mktTxt">SIM</span></span>
      <button class="mlang" id="mlang" type="button">EN</button>
    </div>
  </header>

  <!-- 下拉刷新提示 -->
  <div class="mpull" id="mpull"><i></i><span id="mpullTxt" data-i18n="m.pull">下拉刷新</span></div>

  <!-- ============ 内容 ============ -->
  <main class="mbody" id="mbody">

    <!-- ---------------- 行情 ---------------- -->
    <section class="mv on" data-mv="chart">
      <div class="mcard mchart-card">
        <div class="mread" id="mread">
          <span class="mread-k" id="mreadT">日线</span>
          <span class="mread-i"><em>O</em><b id="mO">—</b></span>
          <span class="mread-i"><em>H</em><b id="mH">—</b></span>
          <span class="mread-i"><em>L</em><b id="mL">—</b></span>
          <span class="mread-i"><em>C</em><b id="mC">—</b></span>
        </div>
        <div id="mPrice" class="mprice"></div>
        <div id="mVol" class="mvol"></div>
      </div>

      <div class="mseg-row">
        <div class="seg" id="mBarSeg">
          <button class="on" data-bar="day" data-i18n="bar.day">日</button>
          <button data-bar="week" data-i18n="bar.week">周</button>
          <button data-bar="hour" data-i18n="bar.hour">1时</button>
          <button data-bar="min15" data-i18n="bar.min15">15分</button>
        </div>
        <div class="seg" id="mOvSeg">
          <button class="on" data-ov="ma">MA</button>
          <button data-ov="bb" data-i18n="ov.bb">布林</button>
          <button class="on" data-ov="sig" data-i18n="ov.sig">信号</button>
        </div>
      </div>

      <div class="msec">
        <div class="msec-h">
          <h3 data-i18n="m.strategy">策略</h3>
          <span class="msec-s" id="mParams"></span>
        </div>
        <div class="mchips" id="mStratChips"></div>
      </div>

      <div class="msec">
        <div class="msec-h"><h3 data-i18n="panel.btMetrics">策略回测指标</h3>
          <span class="msec-s" id="mBtRange"></span></div>
        <div class="mgrid" id="mMetrics"></div>
      </div>

      <div class="msec">
        <div class="msec-h"><h3 data-i18n="m.sigEq">策略净值 vs 基准</h3>
          <span class="msec-s" data-i18n="m.norm100">起点 = 100</span></div>
        <div class="mcard mchart-card">
          <div id="mSigEq" class="mmini"></div>
          <div class="mlegend" id="mSigLegend"></div>
        </div>
      </div>
    </section>

    <!-- ---------------- 账户 ---------------- -->
    <section class="mv" data-mv="account">
      <div class="mhero" id="mHero">
        <div class="mhero-top">
          <span class="mhero-k" data-i18n="card.netliq">净值</span>
          <span class="mconn" id="mConn"><i></i><span data-i18n="acct.conn.off">未连接</span></span>
        </div>
        <div class="mhero-v" id="mNetliq">—</div>
        <div class="mhero-sub"><span id="mHeroCur">HKD</span><em>·</em><span id="mHeroTs">—</span></div>
        <div class="mhero-chips">
          <div class="mchip"><span data-i18n="card.day">当日盈亏</span><b id="mDayPnl">—</b></div>
          <div class="mchip"><span data-i18n="card.pnl">持仓盈亏</span><b id="mPnl">—</b></div>
          <div class="mchip"><span data-i18n="card.lev">杠杆</span><b id="mLev">—</b></div>
        </div>
      </div>

      <div class="mstat4" id="mStat4"></div>

      <div class="msec">
        <div class="msec-h"><h3 data-i18n="acct.alloc">资产配置</h3>
          <span class="msec-s" id="mAllocNote"></span></div>
        <div class="mcard mpad">
          <div class="alloc-bar" id="mAllocBar"></div>
          <div class="mlegend" id="mAllocLegend"></div>
        </div>
      </div>

      <div class="msec">
        <div class="msec-h"><h3 data-i18n="panel.positions">持仓明细</h3>
          <span class="msec-s" id="mPosSum"></span></div>
        <div id="mPosList" class="mlist-card"></div>
      </div>

      <div class="msec">
        <div class="msec-h"><h3 data-i18n="panel.acctCurve">账户净值曲线</h3>
          <span class="msec-s" id="mCurveTag">—</span></div>
        <div class="mcard mchart-card">
          <div id="mAcctCurve" class="mmini"></div>
        </div>
      </div>

      <div class="msec">
        <div class="msec-h"><h3 data-i18n="panel.orders">最近委托</h3></div>
        <div id="mOrderList" class="mlist-card"></div>
      </div>
    </section>

    <!-- ---------------- 净值对比 ---------------- -->
    <section class="mv" data-mv="equity">
      <div class="mtoolbar">
        <select id="mEqSym" class="msel"></select>
        <button class="mbtn" id="mEqRefresh" type="button" data-i18n="common.refresh">刷新</button>
      </div>
      <div class="mcard mchart-card">
        <div id="mEqChart" class="meq"></div>
      </div>
      <div class="mlegend" id="mEqLegend"></div>
      <p class="mhint" data-i18n="eq.hint">各策略净值归一到起点 100 后对比；
        点图例可单独隐藏，长按图表可拖动。</p>
    </section>

    <!-- ---------------- 组合 ---------------- -->
    <section class="mv" data-mv="portfolio">
      <div class="mtoolbar">
        <select id="mPfStrat" class="msel"></select>
        <select id="mPfScheme" class="msel">
          <option value="equal" data-i18n="scheme.equal">等权</option>
          <option value="signal" data-i18n="scheme.signal">信号加权</option>
          <option value="vol_inverse" data-i18n="scheme.vol_inverse">波动率倒数</option>
          <option value="risk_parity" data-i18n="scheme.risk_parity">风险平价</option>
          <option value="vol_target" data-i18n="scheme.vol_target">波动率目标</option>
        </select>
      </div>
      <div class="mstat4" id="mPfCards"></div>
      <div class="mcard mchart-card">
        <div id="mPfEq" class="meq"></div>
      </div>
      <div class="mlegend" id="mPfLegend"></div>

      <div class="msec">
        <div class="msec-h"><h3 data-i18n="panel.weights">标的权重</h3>
          <span class="msec-s" id="mPfWeightNow"></span></div>
        <div class="mcard mchart-card">
          <div id="mPfW" class="mmini"></div>
        </div>
        <div class="mlegend" id="mPfWLegend"></div>
      </div>

      <div class="msec">
        <div class="msec-h"><h3 data-i18n="panel.schemes">权重方案对比</h3>
          <span class="msec-s" data-i18n="schemes.tag">enhanced 实验结果</span></div>
        <div class="mscroll mcard" id="mPfTbl"></div>
      </div>
    </section>

    <!-- ---------------- 更多 ---------------- -->
    <section class="mv" data-mv="more">
      <div class="mlist-card">
        <button class="mrow" data-sub="rank" type="button">
          <span class="mrow-ic ic-rank"></span>
          <span class="mrow-t"><b data-i18n="nav.rank">模型排名</b>
            <em data-i18n="rank.tag">跨 8 标的平均</em></span>
          <span class="mrow-a">›</span>
        </button>
        <button class="mrow" data-sub="risk" type="button">
          <span class="mrow-ic ic-risk"></span>
          <span class="mrow-t"><b data-i18n="nav.risk">风控与显著性</b>
            <em data-i18n="m.risk.sub">PSR / DSR / 风控 A-B</em></span>
          <span class="mrow-a">›</span>
        </button>
        <button class="mrow" data-sub="watch" type="button">
          <span class="mrow-ic ic-watch"></span>
          <span class="mrow-t"><b data-i18n="nav.watch">信号监控</b>
            <em data-i18n="watch.tag">只读</em></span>
          <span class="mrow-a">›</span>
        </button>
        <button class="mrow" data-sub="db" type="button">
          <span class="mrow-ic ic-db"></span>
          <span class="mrow-t"><b data-i18n="nav.db">数据库</b>
            <em data-i18n="m.db.sub">14 张表 · 只读 SQL</em></span>
          <span class="mrow-a">›</span>
        </button>
      </div>

      <div class="mlist-card">
        <button class="mrow" id="mMoreLang" type="button">
          <span class="mrow-ic ic-lang"></span>
          <span class="mrow-t"><b data-i18n="top.lang">语言</b>
            <em data-i18n="m.langHint">中英文切换</em></span>
          <span class="mrow-a" id="mLangNow">中</span>
        </button>
        <a class="mrow" id="mDesktop" href="/?desktop=1">
          <span class="mrow-ic ic-desk"></span>
          <span class="mrow-t"><b data-i18n="m.desktop">桌面版</b>
            <em data-i18n="m.desktopHint">宽屏完整终端</em></span>
          <span class="mrow-a">›</span>
        </a>
      </div>

      <p class="mabout" id="mAbout">QuantLab · 移动端</p>
    </section>

  </main>

  <!-- ============ 底部导航 ============ -->
  <nav class="mtabs" id="mtabs">
    <button class="mtab on" data-mv="chart" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h16M8 16V9m4 7V7m4 9v-4"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span data-i18n="nav.chart">行情</span>
    </button>
    <button class="mtab" data-mv="equity" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round"/></svg>
      <span data-i18n="nav.equity">净值</span>
    </button>
    <button class="mtab" data-mv="portfolio" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"
        fill="none" stroke="currentColor" stroke-width="2"/><circle cx="5" cy="6" r="2"
        fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="19" cy="6" r="2"
        fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="5" cy="18" r="2"
        fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="19" cy="18" r="2"
        fill="none" stroke="currentColor" stroke-width="1.6"/><path
        d="M6.8 7.4l3.4 3m7-3l-3.4 3M6.8 16.6l3.4-3m7 3l-3.4-3" fill="none"
        stroke="currentColor" stroke-width="1.4"/></svg>
      <span data-i18n="nav.portfolio">组合</span>
    </button>
    <button class="mtab" data-mv="account" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path
        d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5v-9z"
        fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18" fill="none"
        stroke="currentColor" stroke-width="2"/><circle cx="17" cy="14.5" r="1.3"
        fill="currentColor"/></svg>
      <span data-i18n="nav.account">账户</span>
    </button>
    <button class="mtab" data-mv="more" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"
        fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/>
        <circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
      <span data-i18n="m.more">更多</span>
    </button>
  </nav>

  <!-- ============ 标的选择器（底部抽屉） ============ -->
  <div class="msheet-mask" id="mSheetMask"></div>
  <div class="msheet" id="mSheet" role="dialog" aria-modal="true">
    <div class="msheet-grab"></div>
    <div class="msheet-head">
      <h3 data-i18n="m.pickSymbol">选择标的</h3>
      <button class="msheet-x" id="mSheetX" type="button" aria-label="close">×</button>
    </div>
    <div class="msheet-search">
      <input id="mSymSearch" autocomplete="off" spellcheck="false"
             data-i18n-ph="top.symbol.ph" placeholder="输入代码…">
    </div>
    <div class="msheet-body" id="mSheetBody"></div>
  </div>

  <!-- ============ 二级页（排名/风控/监控/数据库） ============ -->
  <div class="msub" id="msub">
    <header class="msub-head">
      <button class="msub-back" id="msubBack" type="button" aria-label="back">
        <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h3 id="msubTitle">—</h3>
      <button class="msub-act" id="msubAct" type="button" hidden>—</button>
    </header>
    <div class="msub-body" id="msubBody"></div>
  </div>

  <div class="mtoast" id="mToast"></div>
</div>

<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/static/js/i18n.js?v=20261020e"></script>
<script src="/static/js/mobile.js?v=20261020a"></script>
</body>
</html>
